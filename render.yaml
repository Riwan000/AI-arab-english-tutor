# Render Blueprint — FastAPI backend only (issue #64)
# Deploy: Render Dashboard → New → Blueprint → connect this repo
# Streamlit frontend deploys separately on Streamlit Cloud.
#
# Persistent SQLite (issue #66): add via Render Dashboard → Disks → mount /app/database
# (requires Starter plan; not supported on free tier — do not add `disk` here on free).

services:
  - type: web
    name: ai-english-tutor-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRY_HOURS
        value: "48"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DEFAULT_MODEL
        value: openai/gpt-4.1
      - key: DATABASE_PATH
        value: /app/database/english_tutor.db
      - key: RETENTION_DAYS
        value: "5"
      - key: CORS_ORIGINS
        sync: false
