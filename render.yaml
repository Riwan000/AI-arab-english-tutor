# Render Blueprint — FastAPI backend + React frontend (issue #64)
# Deploy: Render Dashboard → New → Blueprint → connect this repo
# The frontend is the React/Vite app, deployed as the
# ai-english-tutor-frontend static site service defined below.
#
# Persistence is Supabase Postgres (DATABASE_URL below), not a local disk —
# no Render disk/mount needed.

services:
  - type: web
    name: ai-english-tutor-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRY_HOURS
        value: "48"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DEFAULT_MODEL
        value: openai/gpt-4.1
      - key: DATABASE_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RETENTION_DAYS
        value: "5"
      - key: CORS_ORIGINS
        sync: false

  # NOTE: if the backend service above is ever renamed, update VITE_API_URL below to match.
  - name: ai-english-tutor-frontend
    type: web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-english-tutor-api.onrender.com
    routes:
      - path: /*
        destination: /index.html
        matchType: rewrite
